<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اسما خلوصی | دانشگاه آزاد اسلامی مشهد</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(160deg,#eef3f8 0%,#dbe6f1 100%);color:#1d2b3a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;max-width:440px;width:100%;border-radius:22px;box-shadow:0 18px 40px rgba(20,50,90,.15);overflow:hidden;text-align:center}
  .top{background:#0f4c81;padding:32px 20px 70px;color:#fff}
  .top h2{font-size:1.05rem;font-weight:500;opacity:.95}
  .logo{width:120px;height:120px;margin:-60px auto 0;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .logo img{max-height:96px;max-width:96px}
  .body{padding:22px 26px 32px}
  h1{font-size:1.8rem;font-weight:800;margin-bottom:6px;color:#0f4c81}
  .sub{color:#4a5b6c;font-size:1rem;margin-bottom:22px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #e8eef4;font-size:.95rem}
  .row span:first-child{color:#6b7c8d}
  .row span:last-child{font-weight:600;text-align:left}
  a{color:#0f4c81;text-decoration:none;direction:ltr}
  footer{margin-top:18px;font-size:.8rem;color:#8a99a8}
</style>
</head>
<body>
  <div class="card">
    <div class="top"><h2>دانشگاه آزاد اسلامی واحد مشهد</h2></div>
    <div class="logo"><img src="logo.png" alt="آرم دانشگاه آزاد اسلامی"></div>
    <div class="body">
      <h1>اسما خلوصی</h1>
      <p class="sub">دانشجوی کارشناسی روان‌شناسی</p>
      <div class="row"><span>نام و نام خانوادگی</span><span>اسما خلوصی</span></div>
      <div class="row"><span>دانشگاه</span><span>دانشگاه آزاد اسلامی مشهد (دلاوران)</span></div>
      <div class="row"><span>رشته</span><span>روان‌شناسی</span></div>
      <div class="row"><span>ترم</span><span>هفتم</span></div>
      <div class="row"><span>ایمیل</span><span><a href="mailto:asma.kholoosi@iau.ir">asma.kholoosi@iau.ir</a></span></div>
      <footer>Asma Kholoosi · Islamic Azad University, Mashhad</footer>
    </div>
  </div>
</body>
</html>
